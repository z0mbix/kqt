name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p '*_test.py'
      - run: go build -trimpath -o bin/kqt ./cmd/kqt
      - run: python3 scripts/tui-smoke.py
      - run: python3 scripts/operator-smoke.py
      - run: python3 scripts/features-smoke.py --feature paging
      - run: python3 scripts/features-smoke.py --feature header
      - run: python3 scripts/features-smoke.py --feature relations
      - run: python3 scripts/features-smoke.py --feature manifest
      - run: python3 scripts/features-smoke.py --feature actions
      - run: python3 scripts/features-smoke.py --feature diagnostics
      - run: python3 scripts/features-smoke.py --feature help
      - run: python3 scripts/features-smoke.py --feature inspector
      - run: python3 scripts/features-smoke.py --feature watch
      - run: python3 scripts/features-smoke.py --feature access
      - run: python3 scripts/features-smoke.py --feature overview
      - run: python3 scripts/features-smoke.py --feature downloads
      - run: python3 scripts/features-smoke.py --feature logs-controls
      - run: python3 scripts/features-smoke.py --feature log-queries
      - run: python3 scripts/features-smoke.py --feature log-options
      - run: python3 scripts/features-smoke.py --feature rollouts
      - run: python3 scripts/features-smoke.py --feature contexts
      - run: python3 scripts/features-smoke.py --feature command-history
      - run: python3 scripts/features-smoke.py --feature debug
      - run: python3 scripts/features-smoke.py --feature debug-setup
